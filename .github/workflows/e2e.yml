name: E2E

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # dev-rooms imports engine, protocol and server from their dist/.
      - run: npm run build -w engine && npm run build -w protocol && npm run build -w server
      - run: npx playwright install --with-deps chromium
        working-directory: client
      # Starts dev-rooms and the Vite dev server itself (client/playwright.config.ts).
      - run: npm run test:e2e -w client
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results
          retention-days: 7
