name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # In workspace order: server and client resolve engine and protocol
      # through their built dist/, so everything below needs this first.
      - run: npm run build
      # The engine's prebuild regenerates cards/generated.ts, the card shards
      # and their index; a diff or a new file here means a card was added
      # without committing what the codegen wrote for it.
      - name: Generated files are committed
        run: |
          git diff --exit-code
          untracked=$(git ls-files --others --exclude-standard)
          if [ -n "$untracked" ]; then echo "Uncommitted new files:"; echo "$untracked"; exit 1; fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The fuzzer: random play until legalActions offers something dispatch
      # refuses, or a game runs away. Exits non-zero naming the seed.
      - name: Fuzz, 2 players
        run: node engine/scripts/random-demo.mjs --games 30
      # Four random players can take 200 turns to finish a game (seed 3 does
      # with a 3,000-card pool, in about 45s). The limit is there to catch a
      # hang, not a long game.
      - name: Fuzz, 4 players
        run: node engine/scripts/random-demo.mjs --games 8 --players 4 --timeout 120
